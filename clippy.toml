# Same as craft-libs: tests may use unwrap/expect/panic (CLAUDE.md 1.1 applies to non-test code).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
disallowed-types = [
    { path = "egui::ComboBox", reason = "use craft_ui::ComboBox: egui's combo box menu can't grow back while open (egui#5225)" },
]
