[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# craft-ui needs Rust 1.95 or later.
rust-version = "1.95"
repository = "https://github.com/Lurkrul/GitCraft"

[workspace.dependencies]
# Shared Crafting App libraries, pinned to one immutable commit. When this rev changes, update
# the [patch.crates-io] section below to match craft-libs' own Cargo.toml at the same rev.
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "c39e435cc34417843793df240a0b38bac970179b" }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "c39e435cc34417843793df240a0b38bac970179b" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "c39e435cc34417843793df240a0b38bac970179b", features = ["egui"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "c39e435cc34417843793df240a0b38bac970179b" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "c39e435cc34417843793df240a0b38bac970179b" }

gitcraft-git = { path = "crates/git" }

egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false }
# Same version and base features as craft-libs; `clock` adds the local time zone for commit dates.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

# CLAUDE.md 1.1: no panicking shortcuts outside tests (clippy.toml allows them in tests).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# craft-libs builds against the suite's own egui and winit forks. Cargo does not pass a
# dependency's [patch] section on to the app using it, so these lines are copied from craft-libs'
# Cargo.toml at the rev pinned above; without them the build would contain two different eguis.
# Only crates in our dependency graph are listed (add egui_kittest, ... when used).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
